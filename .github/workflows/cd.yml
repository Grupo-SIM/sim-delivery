name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      # {"build":["backend","frontend",...]} — only packages with a build script are included.
      # The web (GHCR) job fans out over this list; the Tauri jobs gate on whether
      # "frontend" is in it. A push that touches neither builds nothing.
      # An empty base-sha (workflow_dispatch / first push) plans every service.
      tasks: ${{ steps.affected.outputs.tasks }}
      # JSON arrays parsed from newline-separated slug@url GitHub variables.
      slugs: ${{ steps.slugs.outputs.values }}
      variants: ${{ steps.slugs.outputs.variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Need history present so Turbo's --affected can diff against the base.
          fetch-depth: 0

      - name: Compute affected services
        id: affected
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: build
          base-sha: ${{ github.event.before }}

      - name: Parse company slugs
        id: slugs
        env:
          APP_URLS: ${{ vars.APP_URL }}
          API_URLS: ${{ vars.API_URL }}
        run: |
          parse_urls() {
            jq -Rn --arg value "$1" '
              $value
              | split("\n")
              | map(gsub("^\\s+|\\s+$"; ""))
              | map(select(length > 0) | capture("^(?<slug>[^@]+)@(?<url>.*)$") | {key: .slug, value: .url})
              | from_entries
            '
          }

          app_urls=$(parse_urls "$APP_URLS")
          api_urls=$(parse_urls "$API_URLS")
          variants=$(jq -cn --argjson app "$app_urls" --argjson api "$api_urls" '
            ($app | keys) as $appSlugs
            | ($api | keys) as $apiSlugs
            | if $appSlugs != $apiSlugs then
                error("APP_URL and API_URL must contain the same slugs")
              else
                [$appSlugs[] | {slug: ., appUrl: $app[.], apiUrl: $api[.]}]
              end
          ')
          slugs=$(jq -c '[.[].slug]' <<< "$variants")
          if [ "$slugs" = "[]" ]; then
            echo "::error title=Missing frontend companies::Set APP_URL and API_URL using slug@url lines."
            exit 1
          fi
          echo "values=$slugs" >> "$GITHUB_OUTPUT"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  ghcr-backend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Build and publish backend image
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'backend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            NODE_ENV=production
          cache-scope: backend_${{ matrix.slug }}
          dockerfile: backend/Dockerfile
          image: jbmidia/sim-delivery_backend_${{ matrix.slug }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

  ghcr-frontend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Build and publish frontend image
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'frontend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            NODE_ENV=production
            VITE_API_URL=${{ matrix.apiUrl }}
            VITE_APP_URL=${{ matrix.appUrl }}
            VITE_COMPANY_SLUG=${{ matrix.slug }}
          cache-scope: frontend_${{ matrix.slug }}
          dockerfile: frontend/Dockerfile
          # Each company gets its own tagged image: frontend-zero-grau, frontend-acai-top, …
          image: jbmidia/sim-delivery_frontend_${{ matrix.slug }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

