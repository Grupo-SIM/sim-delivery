[package]
name = "tauri-plugin-statusbar-style"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-statusbar-style"

[lib]
name = "tauri_plugin_statusbar_style"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
