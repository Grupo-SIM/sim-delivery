name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      variants:
        description: "Variants to build, comma-separated (empty = all configured variants)"
        required: false
        type: string

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.all.outputs.tasks || steps.affected.outputs.tasks }}
      slugs: ${{ steps.slugs.outputs.values }}
      variants: ${{ steps.slugs.outputs.variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun install

      - name: Plan all services
        id: all
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "tasks=$(bun scripts/affected-packages.ts '' build)" >> "$GITHUB_OUTPUT"

      - name: Compute affected services
        id: affected
        if: ${{ github.event_name == 'push' }}
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: build
          base-sha: ${{ github.event.before }}

      - name: Parse company slugs
        id: slugs
        env:
          REQUESTED_VARIANTS: ${{ inputs.variants }}
          VARIANTS: ${{ vars.VARIANTS }}
          LEGACY_APP_URLS: ${{ vars.APP_URL }}
        run: |
          if [[ -n "${REQUESTED_VARIANTS//[[:space:]]/}" ]]; then
            VARIANTS="${REQUESTED_VARIANTS//,/$'\n'}"
          fi
          slugs=$(jq -Rnc --arg value "${VARIANTS:-$LEGACY_APP_URLS}" '
            $value | split("\n")
            | map(gsub("^\\s+|\\s+$"; "") | split("@")[0] | select(length > 0))
            | unique
            | if length == 0 or any(.[]; test("^[a-z0-9]+(-[a-z0-9]+)*$") | not)
              then error("Set VARIANTS to one company slug per line") else . end
          ')
          variants=$(jq -c '[.[] | {slug: .}]' <<< "$slugs")
          echo "values=$slugs" >> "$GITHUB_OUTPUT"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  ghcr-backend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Backend
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'backend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            BRANDING_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
            NODE_ENV=production
          dockerfile: backend/Dockerfile
          image_suffix: backend_${{ matrix.slug }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}

  ghcr-frontend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Frontend
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'frontend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            BRANDING_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
            NODE_ENV=production
            VITE_CDN_URL=${{ vars.VITE_CDN_URL }}
          dockerfile: frontend/Dockerfile
          image_suffix: frontend_${{ matrix.slug }}
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}

  desktop:
    name: ${{ matrix.slug }} / Build & release ${{ matrix.platform }} app
    needs: detect
    # Only the Tauri frontend produces these apps; skip when it isn't affected.
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'frontend') }}
    permissions:
      # tauri-action creates the GitHub release / uploads the installers.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.detect.outputs.slugs) }}
        # Linux/macOS builds disabled for now; re-add ubuntu-latest / macos-latest to re-enable.
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      COMPANY_SLUG: ${{ matrix.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}
      VITE_COMPANY_SLUG: ${{ matrix.slug }}
      # In-app updates: signs the installers and enables the updater config. Both are optional;
      # without them the build still works, but installed apps never see new versions.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The `printers` crate (silent receipt printing) links CUPS on Linux; macOS ships it.
      - name: Install CUPS headers
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev

      # tauri validates the bundle identifier before beforeBuildCommand runs, so branding
      # (including the per-company identifier) must be injected beforehand.
      - name: Set up Bun for branding injection
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies for branding injection
        run: bun install --frozen-lockfile --linker=isolated

      - name: Inject company branding
        run: bunx turbo frontend#inject

      - name: Build & release desktop app
        uses: hyoretsu/gh-actions/tauri-build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # One release per company: every variant shares the app version.
          tag-name: ${{ matrix.slug }}-v__VERSION__
          release-name: ${{ matrix.slug }} v__VERSION__

      # The repository is private, so installed apps cannot read GitHub releases. Mirror the signed
      # installers and a generated latest.json into the public media bucket (served through the CDN).
      - name: Publish updater manifest to CDN
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' && env.TAURI_UPDATER_PUBKEY != '' }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CDN_URL: ${{ vars.VITE_CDN_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_PREFIX: ${{ vars.S3_PREFIX }}
        run: |
          set -euo pipefail
          version=$(jq -r .version frontend/src-tauri/tauri.conf.json)
          key="updates/${{ matrix.slug }}"
          bucket_path="s3://${S3_BUCKET}/${S3_PREFIX:+${S3_PREFIX%/}/}${key}"
          cdn="${CDN_URL%/}/${key}"
          # tauri-action skips latest.json when it cannot match signatures (non-ASCII product names),
          # so build the manifest from the local bundle output instead of the GitHub release.
          bundle=$(find . -type d -path '*target/release/bundle' -print -quit)
          # Product names can be non-ASCII ("Estação 237"); expanding globs in-shell keeps the
          # exact filename bytes, unlike capturing `find` output on the Windows runner.
          exes=("$bundle"/nsis/*-setup.exe); exe="${exes[0]}"
          msis=("$bundle"/msi/*.msi); msi="${msis[0]}"
          [ -f "${exe}.sig" ] && [ -f "${msi}.sig" ] || { echo "::error::Missing updater signatures in $bundle"; find "$bundle" -type f | sort; exit 1; }
          out=updater
          mkdir -p "$out"
          exe_name="${{ matrix.slug }}_${version}_x64-setup.exe"
          msi_name="${{ matrix.slug }}_${version}_x64_en-US.msi"
          cp "$exe" "$out/$exe_name"; cp "${exe}.sig" "$out/$exe_name.sig"
          cp "$msi" "$out/$msi_name"; cp "${msi}.sig" "$out/$msi_name.sig"
          base="${cdn}/${version}"
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg exe "$base/$exe_name" --rawfile exesig "$out/$exe_name.sig" \
            --arg msi "$base/$msi_name" --rawfile msisig "$out/$msi_name.sig" \
            '{version: $version, pub_date: $date, platforms: {
               "windows-x86_64": {url: $exe, signature: ($exesig | rtrimstr("\n"))},
               "windows-x86_64-nsis": {url: $exe, signature: ($exesig | rtrimstr("\n"))},
               "windows-x86_64-msi": {url: $msi, signature: ($msisig | rtrimstr("\n"))}}}' \
            > latest.json
          # Installers first, manifest last: a client never sees a manifest whose files are missing.
          aws s3 cp "$out" "${bucket_path}/${version}" --endpoint-url "$S3_ENDPOINT" --recursive
          aws s3 cp latest.json "${bucket_path}/latest.json" --endpoint-url "$S3_ENDPOINT" \
            --content-type application/json --cache-control "no-cache"

