# Only successful, content-hashed assets may be cached permanently.
map $status $asset_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # HTML and mutable branding must revalidate after every deployment.
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $asset_cache_control always;
    }

    # A missing file is an error, never an HTML response masquerading as CSS/JS.
    location ~* \.(?:html?|css|m?js|json|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|webmanifest|txt|xml|pdf)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
