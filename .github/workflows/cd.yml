name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.all.outputs.tasks || steps.affected.outputs.tasks }}
      slugs: ${{ steps.slugs.outputs.values }}
      variants: ${{ steps.slugs.outputs.variants }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: bun install

      - name: Plan all services
        id: all
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "tasks=$(bun scripts/affected-packages.ts '' build)" >> "$GITHUB_OUTPUT"

      - name: Compute affected services
        id: affected
        if: ${{ github.event_name == 'push' }}
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: build
          base-sha: ${{ github.event.before }}

      - name: Parse company slugs
        id: slugs
        env:
          VARIANTS: ${{ vars.VARIANTS }}
          LEGACY_APP_URLS: ${{ vars.APP_URL }}
        run: |
          slugs=$(jq -Rnc --arg value "${VARIANTS:-$LEGACY_APP_URLS}" '
            $value | split("\n")
            | map(gsub("^\\s+|\\s+$"; "") | split("@")[0] | select(length > 0))
            | unique
            | if length == 0 or any(.[]; test("^[a-z0-9]+(-[a-z0-9]+)*$") | not)
              then error("Set VARIANTS to one company slug per line") else . end
          ')
          variants=$(jq -c '[.[] | {slug: .}]' <<< "$slugs")
          echo "values=$slugs" >> "$GITHUB_OUTPUT"
          echo "variants=$variants" >> "$GITHUB_OUTPUT"

  ghcr-backend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Backend
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'backend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            BRANDING_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
            NODE_ENV=production
          cache-scope: backend_${{ matrix.slug }}
          dockerfile: backend/Dockerfile
          image: jbmidia/sim-delivery_backend_${{ matrix.slug }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

  ghcr-frontend:
    name: ${{ matrix.slug && format('{0} / ', matrix.slug) || '' }}Frontend
    needs: detect
    if: ${{ contains(fromJSON(needs.detect.outputs.tasks).build, 'frontend') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.variants) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build and publish image
        uses: hyoretsu/gh-actions/containers@main
        with:
          build-args: |
            COMPANY_SLUG=${{ matrix.slug }}
            BRANDING_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
            NODE_ENV=production
          cache-scope: frontend_${{ matrix.slug }}
          dockerfile: frontend/Dockerfile
          # Each company gets its own tagged image: frontend-zero-grau, frontend-acai-top, …
          image: jbmidia/sim-delivery_frontend_${{ matrix.slug }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}

