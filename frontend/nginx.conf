# Only successful, content-hashed assets may be cached permanently.
map $status $asset_cache_control {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

# Extra query params (fbclid, gclid, utm_term...) received on a tracked short link, appended after the fixed UTMs.
# Fixed UTMs come first, so they win over any same-name param in the incoming URL.
map $args $utm_extra_args {
    ""      "";
    default "&$args";
}

server {
    listen 5173;
    listen [::]:5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text assets are served uncompressed otherwise (CSS ~115 KiB -> ~19 KiB, JS ~70% smaller). HTML is always eligible.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;
    gzip_vary on;

    # HTML and mutable branding must revalidate after every deployment.
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control $asset_cache_control always;
    }

    # A missing file is an error, never an HTML response masquerading as CSS/JS.
    location ~* \.(?:html?|css|m?js|json|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|webmanifest|txt|xml|pdf)$ {
        try_files $uri =404;
    }

    # Tracked short links: relative Location, so the public scheme/host (behind the TLS proxy) is kept.
    # Keep in sync with frontend/src/lib/utm-networks.ts (the SPA routes there are the dev/Tauri fallback).
    absolute_redirect off;

    location = /cardapio {
        return 302 "/?utm_source=ig&utm_medium=social&utm_campaign=branding_instagram&utm_content=link_in_bio$utm_extra_args";
    }

    location = /utm/instagram {
        return 302 "/?utm_source=ig&utm_medium=social&utm_campaign=branding_instagram&utm_content=link_in_bio$utm_extra_args";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
