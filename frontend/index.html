<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<script>
			// Applied before first paint to avoid a light->dark flash; kept in sync
			// at runtime by Providers (src/providers.tsx).
			document.documentElement.classList.add(
				window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
			);
		</script>
		<!-- Build script downloads branding assets and writes this stylesheet before Vite builds. -->
		<link rel="stylesheet" href="/branding.css" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0012ff" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Outfit:wght@400;500;600;800;900&display=swap"
			rel="stylesheet"
		/>
		<title>Zero Grau</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
